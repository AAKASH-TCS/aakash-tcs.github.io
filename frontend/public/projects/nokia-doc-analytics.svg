<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1430"/><stop offset="1" stop-color="#0b2030"/></linearGradient>
    <radialGradient id="gA" cx=".85" cy=".15" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#gA)"/>
  <rect width="800" height="450" fill="url(#gB)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <text x="32" y="44" fill="#9aa3c7" font-size="13" letter-spacing="2">EXTRACT · STORE · ASK</text>

  <!-- Documents -->
  <g>
    <rect x="52" y="86" width="96" height="120" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15"/>
    <rect x="44" y="94" width="96" height="120" rx="10" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <rect x="36" y="102" width="96" height="120" rx="10" fill="#161e3d" stroke="#fff" stroke-opacity=".3"/>
    <g fill="#9aa3c7" fill-opacity=".7"><rect x="50" y="120" width="56" height="6" rx="3"/><rect x="50" y="136" width="68" height="5" rx="2.5"/><rect x="50" y="148" width="62" height="5" rx="2.5"/><rect x="50" y="160" width="68" height="5" rx="2.5"/><rect x="50" y="172" width="44" height="5" rx="2.5"/></g>
    <rect x="50" y="190" width="68" height="18" rx="4" fill="#22d3ee" fill-opacity=".25"/>
    <text x="84" y="246" fill="#9aa3c7" font-size="12" text-anchor="middle">Business documents</text>
  </g>
  <path d="M140 160H192" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM gateway -->
  <rect x="198" y="122" width="170" height="76" rx="16" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-width="2"/>
  <text x="283" y="154" fill="#e8eaf6" font-size="15" font-weight="700" text-anchor="middle">Private LLM Gateway</text>
  <text x="283" y="177" fill="#9aa3c7" font-size="13" text-anchor="middle">extract + structure</text>
  <path d="M368 160H414" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MySQL -->
  <g>
    <path d="M420 112v92c0 11 25 20 55 20s55-9 55-20v-92" fill="#fff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".7"/>
    <ellipse cx="475" cy="112" rx="55" ry="18" fill="#163047" stroke="#22d3ee" stroke-opacity=".7"/>
    <path d="M420 144c0 11 25 20 55 20s55-9 55-20M420 176c0 11 25 20 55 20s55-9 55-20" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="412" y="236" fill="#e8eaf6" font-size="14" font-weight="600" text-anchor="end">MySQL</text>
  </g>
  <path d="M530 160H576" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Analytics view -->
  <rect x="582" y="76" width="188" height="170" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
  <text x="600" y="102" fill="#9aa3c7" font-size="12" font-weight="600">ANALYTICS VIEW</text>
  <path d="M600 224H752" stroke="#fff" stroke-opacity=".2"/>
  <g fill="url(#bar)">
    <rect x="608" y="170" width="20" height="54" rx="4"/>
    <rect x="638" y="140" width="20" height="84" rx="4"/>
    <rect x="668" y="186" width="20" height="38" rx="4"/>
    <rect x="698" y="124" width="20" height="100" rx="4"/>
    <rect x="728" y="156" width="20" height="68" rx="4"/>
  </g>

  <!-- Query path -->
  <rect x="32" y="312" width="210" height="84" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
  <text x="50" y="337" fill="#f472b6" font-size="12" font-weight="600">NETWORK ENGINEER</text>
  <text x="50" y="361" fill="#e8eaf6" font-size="14">"Which sites logged the</text>
  <text x="50" y="381" fill="#e8eaf6" font-size="14">most alarms this week?"</text>
  <path d="M242 354H284" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="290" y="324" width="150" height="60" rx="14" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-width="2"/>
  <text x="365" y="350" fill="#e8eaf6" font-size="15" font-weight="700" text-anchor="middle">LangGraph</text>
  <text x="365" y="370" fill="#9aa3c7" font-size="12" text-anchor="middle">router</text>
  <path d="M440 354H482" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="488" y="324" width="130" height="60" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="553" y="359" fill="#e8eaf6" font-size="15" font-weight="700" text-anchor="middle">SQL agent</text>
  <path d="M540 324L500 232" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <path d="M618 354H660" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="666" y="324" width="104" height="60" rx="14" fill="#fff" fill-opacity=".07" stroke="#34d399" stroke-opacity=".7"/>
  <text x="718" y="350" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">Answer</text>
  <text x="718" y="370" fill="#9aa3c7" font-size="12" text-anchor="middle">+ chart</text>
</svg>
