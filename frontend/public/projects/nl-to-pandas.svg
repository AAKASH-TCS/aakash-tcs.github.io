<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0f2e"/><stop offset="1" stop-color="#0c1422"/></linearGradient>
    <radialGradient id="gA" cx=".2" cy=".1" r=".6"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".9" cy=".9" r=".55"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#gA)"/>
  <rect width="800" height="450" fill="url(#gB)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Question -->
  <rect x="32" y="32" width="430" height="64" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/>
  <circle cx="62" cy="64" r="14" fill="#f472b6" fill-opacity=".25"/>
  <text x="62" y="69" fill="#f472b6" font-size="14" font-weight="700" text-anchor="middle">?</text>
  <text x="88" y="70" fill="#e8eaf6" font-size="16">Which regions grew more than 10% in Q3?</text>
  <path d="M120 96V124" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Code editor -->
  <rect x="32" y="130" width="460" height="196" rx="16" fill="#0b0e1f" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="54" cy="152" r="5" fill="#ff5f57"/><circle cx="72" cy="152" r="5" fill="#febc2e"/><circle cx="90" cy="152" r="5" fill="#28c840"/>
  <text x="112" y="157" fill="#6f779c" font-size="12">generated.py</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="52" y="196" fill="#6f779c"># generated by LLM (Groq / Gemini)</text>
    <text x="52" y="228" fill="#e8eaf6">mask = (df[<tspan fill="#34d399">"quarter"</tspan>] == <tspan fill="#34d399">"Q3"</tspan>) &amp;</text>
    <text x="110" y="252" fill="#e8eaf6">(df[<tspan fill="#34d399">"growth"</tspan>] &gt; <tspan fill="#f472b6">0.10</tspan>)</text>
    <text x="52" y="284" fill="#e8eaf6">result = df.loc[mask,</text>
    <text x="210" y="308" fill="#e8eaf6">[<tspan fill="#34d399">"region"</tspan>, <tspan fill="#34d399">"growth"</tspan>]]</text>
  </g>
  <path d="M492 228H526" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Validation -->
  <rect x="532" y="130" width="238" height="196" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
  <text x="552" y="160" fill="#9aa3c7" font-size="12" font-weight="600" letter-spacing="1">VALIDATION</text>
  <g font-size="15" fill="#e8eaf6">
    <circle cx="563" cy="194" r="11" fill="#34d399" fill-opacity=".2"/><path d="M557 194l4 4 8-8" stroke="#34d399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="199">Syntax check</text>
    <circle cx="563" cy="230" r="11" fill="#34d399" fill-opacity=".2"/><path d="M557 230l4 4 8-8" stroke="#34d399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="235">Logic check</text>
    <circle cx="563" cy="266" r="11" fill="#34d399" fill-opacity=".2"/><path d="M557 266l4 4 8-8" stroke="#34d399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="271">Generated test cases</text>
    <circle cx="563" cy="302" r="11" fill="#22d3ee" fill-opacity=".15"/><path d="M558 302a5 5 0 1 0 2-4" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="584" y="307" fill="#9aa3c7">Bounded retries</text>
  </g>

  <!-- Result -->
  <path d="M651 326V350" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="532" y="356" width="238" height="70" rx="14" fill="#fff" fill-opacity=".07" stroke="#34d399" stroke-opacity=".6"/>
  <g font-size="13">
    <text x="552" y="379" fill="#9aa3c7" font-weight="600">region</text><text x="740" y="379" fill="#9aa3c7" font-weight="600" text-anchor="end">growth</text>
    <text x="552" y="399" fill="#e8eaf6">South</text><text x="740" y="399" fill="#34d399" text-anchor="end">14.2%</text>
    <text x="552" y="417" fill="#e8eaf6">West</text><text x="740" y="417" fill="#34d399" text-anchor="end">11.8%</text>
  </g>

  <!-- Stack chips -->
  <g font-size="13" fill="#c9cfee">
    <rect x="32" y="372" width="120" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="92" y="394" text-anchor="middle">Streamlit UI</text>
    <rect x="162" y="372" width="96" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="210" y="394" text-anchor="middle">Pandas</text>
    <rect x="268" y="372" width="144" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="340" y="394" text-anchor="middle">Groq · Gemini</text>
  </g>
</svg>
