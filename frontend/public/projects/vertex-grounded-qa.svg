<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071c24"/><stop offset="1" stop-color="#11122e"/></linearGradient>
    <radialGradient id="gA" cx=".5" cy=".35" r=".45"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".9" cy=".95" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#gA)"/>
  <rect width="800" height="450" fill="url(#gB)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Query -->
  <rect x="32" y="48" width="226" height="84" rx="16" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/>
  <text x="50" y="74" fill="#f472b6" font-size="12" font-weight="600">QUESTION</text>
  <text x="50" y="98" fill="#e8eaf6" font-size="14">"What is the refund policy</text>
  <text x="50" y="117" fill="#e8eaf6" font-size="14">for annual plans?"</text>
  <path d="M145 132V160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Embedding -->
  <rect x="32" y="166" width="226" height="96" rx="16" fill="#fff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".5"/>
  <text x="50" y="192" fill="#22d3ee" font-size="12" font-weight="600">BGE-SMALL EMBEDDING</text>
  <g fill="#22d3ee">
    <rect x="50" y="222" width="10" height="24" rx="2" fill-opacity=".9"/><rect x="64" y="210" width="10" height="36" rx="2" fill-opacity=".6"/>
    <rect x="78" y="230" width="10" height="16" rx="2" fill-opacity=".8"/><rect x="92" y="204" width="10" height="42" rx="2" fill-opacity=".5"/>
    <rect x="106" y="226" width="10" height="20" rx="2" fill-opacity=".9"/><rect x="120" y="214" width="10" height="32" rx="2" fill-opacity=".6"/>
    <rect x="134" y="234" width="10" height="12" rx="2" fill-opacity=".8"/><rect x="148" y="218" width="10" height="28" rx="2" fill-opacity=".5"/>
    <rect x="162" y="208" width="10" height="38" rx="2" fill-opacity=".9"/><rect x="176" y="228" width="10" height="18" rx="2" fill-opacity=".6"/>
  </g>
  <text x="200" y="244" fill="#9aa3c7" font-size="14">…</text>
  <path d="M258 214H296" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Vector space -->
  <rect x="302" y="48" width="236" height="300" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/>
  <text x="320" y="74" fill="#9aa3c7" font-size="12" font-weight="600">VERTEX AI VECTOR SEARCH</text>
  <g fill="#9aa3c7" fill-opacity=".45">
    <circle cx="336" cy="120" r="4"/><circle cx="372" cy="104" r="3"/><circle cx="352" cy="300" r="4"/><circle cx="504" cy="118" r="4"/>
    <circle cx="500" cy="296" r="3"/><circle cx="330" cy="246" r="3"/><circle cx="512" cy="232" r="4"/>
    <circle cx="460" cy="96" r="3"/><circle cx="350" cy="180" r="3"/><circle cx="520" cy="270" r="3"/><circle cx="440" cy="292" r="4"/>
    <circle cx="380" cy="270" r="3"/><circle cx="500" cy="172" r="3"/>
  </g>
  <circle cx="428" cy="196" r="58" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="5 5"/>
  <g fill="#34d399"><circle cx="400" cy="172" r="6"/><circle cx="458" cy="210" r="6"/><circle cx="414" cy="230" r="6"/></g>
  <path d="M428 184l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#f472b6"/>
  <text x="420" y="330" fill="#9aa3c7" font-size="12" text-anchor="middle">top-k nearest passages</text>

  <!-- Retrieved chunks -->
  <path d="M538 140H566" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="13">
    <rect x="572" y="48" width="198" height="46" rx="12" fill="#fff" fill-opacity=".07" stroke="#34d399" stroke-opacity=".5"/>
    <text x="588" y="76" fill="#34d399" font-weight="700">[1]</text><rect x="616" y="66" width="136" height="6" rx="3" fill="#9aa3c7" fill-opacity=".5"/>
    <rect x="572" y="102" width="198" height="46" rx="12" fill="#fff" fill-opacity=".07" stroke="#34d399" stroke-opacity=".5"/>
    <text x="588" y="130" fill="#34d399" font-weight="700">[2]</text><rect x="616" y="120" width="116" height="6" rx="3" fill="#9aa3c7" fill-opacity=".5"/>
    <rect x="572" y="156" width="198" height="46" rx="12" fill="#fff" fill-opacity=".07" stroke="#34d399" stroke-opacity=".5"/>
    <text x="588" y="184" fill="#34d399" font-weight="700">[3]</text><rect x="616" y="174" width="128" height="6" rx="3" fill="#9aa3c7" fill-opacity=".5"/>
  </g>
  <path d="M671 202V230" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Gemini answer -->
  <rect x="572" y="236" width="198" height="166" rx="16" fill="#fff" fill-opacity=".08" stroke="url(#acc)" stroke-width="2"/>
  <path d="M598 262c0 8 6 14 14 14-8 0-14 6-14 14 0-8-6-14-14-14 8 0 14-6 14-14z" fill="url(#acc)"/>
  <text x="620" y="281" fill="#e8eaf6" font-size="15" font-weight="700">Gemini</text>
  <g fill="#c9cfee" fill-opacity=".7"><rect x="590" y="304" width="160" height="6" rx="3"/><rect x="590" y="318" width="146" height="6" rx="3"/><rect x="590" y="332" width="120" height="6" rx="3"/></g>
  <text x="590" y="362" fill="#34d399" font-size="13" font-weight="600">Sources [1] [3]</text>
  <rect x="590" y="372" width="84" height="20" rx="10" fill="#34d399" fill-opacity=".18"/>
  <text x="632" y="386" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">GROUNDED</text>

  <!-- Chips -->
  <g font-size="13" fill="#c9cfee">
    <rect x="32" y="372" width="140" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="102" y="394" text-anchor="middle">Safety settings</text>
    <rect x="182" y="372" width="150" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="257" y="394" text-anchor="middle">Retrieval quality</text>
  </g>
</svg>
