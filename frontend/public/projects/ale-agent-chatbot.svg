<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140f30"/><stop offset="1" stop-color="#071a24"/></linearGradient>
    <radialGradient id="gA" cx=".15" cy=".15" r=".6"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#gA)"/>
  <rect width="800" height="450" fill="url(#gB)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <text x="32" y="44" fill="#9aa3c7" font-size="13" letter-spacing="2">AGENT ARCHITECTURE</text>

  <!-- Customer message -->
  <rect x="32" y="178" width="200" height="94" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
  <text x="50" y="204" fill="#f472b6" font-size="12" font-weight="600">CUSTOMER</text>
  <text x="50" y="230" fill="#e8eaf6" font-size="15">"My switch keeps</text>
  <text x="50" y="251" fill="#e8eaf6" font-size="15">dropping its VLAN config"</text>
  <path d="M232 225H284" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Neo4j GraphRAG -->
  <text x="300" y="44" fill="#9aa3c7" font-size="12">Neo4j · GraphRAG intent map</text>
  <g stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.5">
    <path d="M320 92L362 66M362 66L410 98M410 98L452 70M320 92L370 124M370 124L410 98M410 98L460 126M452 70L460 126"/>
  </g>
  <g fill="#8b5cf6"><circle cx="320" cy="92" r="9"/><circle cx="362" cy="66" r="7"/><circle cx="452" cy="70" r="7"/><circle cx="460" cy="126" r="8"/></g>
  <circle cx="410" cy="98" r="11" fill="#22d3ee"/>
  <circle cx="370" cy="124" r="7" fill="#f472b6"/>
  <path d="M390 140V168" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>

  <!-- Orchestrator -->
  <rect x="290" y="175" width="200" height="100" rx="18" fill="#fff" fill-opacity=".08" stroke="url(#acc)" stroke-width="2"/>
  <text x="390" y="217" fill="#e8eaf6" font-size="19" font-weight="700" text-anchor="middle">LangGraph</text>
  <text x="390" y="242" fill="#9aa3c7" font-size="14" text-anchor="middle">Orchestrator</text>

  <!-- Agents -->
  <path d="M490 210L574 110" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M490 225H574" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M490 240L574 290" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="580" y="80" width="190" height="58" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="604" cy="109" r="7" fill="#8b5cf6"/>
    <text x="622" y="114" fill="#e8eaf6" font-size="15" font-weight="600">Support agent</text>
    <rect x="580" y="196" width="190" height="58" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="604" cy="225" r="7" fill="#22d3ee"/>
    <text x="622" y="230" fill="#e8eaf6" font-size="15" font-weight="600">Knowledge agent</text>
    <rect x="580" y="262" width="190" height="58" rx="14" fill="#fff" fill-opacity=".07" stroke="#f472b6" stroke-opacity=".7"/>
    <circle cx="604" cy="291" r="7" fill="#f472b6"/>
    <text x="622" y="288" fill="#e8eaf6" font-size="15" font-weight="600">Ticketing agent</text>
    <text x="622" y="306" fill="#9aa3c7" font-size="12">ReAct</text>
  </g>

  <!-- MCP tool -->
  <path d="M675 320V346" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="560" y="352" width="210" height="70" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="578" y="378" fill="#22d3ee" font-size="12" font-weight="600">MCP TOOL</text>
  <text x="576" y="401" fill="#e8eaf6" font-size="12.5" font-family="Consolas, 'Courier New', monospace">salesforce.create_ticket</text>

  <!-- Capabilities -->
  <g font-size="13" fill="#c9cfee">
    <rect x="32" y="372" width="128" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="96" y="394" text-anchor="middle">SSE streaming</text>
    <rect x="170" y="372" width="108" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="224" y="394" text-anchor="middle">Guardrails</text>
    <rect x="288" y="372" width="178" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".15"/>
    <text x="377" y="394" text-anchor="middle">Checkpointed memory</text>
  </g>
</svg>
