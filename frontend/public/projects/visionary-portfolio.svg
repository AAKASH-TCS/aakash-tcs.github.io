<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120b2a"/><stop offset="1" stop-color="#0a1824"/></linearGradient>
    <radialGradient id="gA" cx=".25" cy=".2" r=".55"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx=".75" cy=".85" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#gA)"/>
  <rect width="800" height="450" fill="url(#gB)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Browser window -->
  <rect x="40" y="44" width="480" height="362" rx="18" fill="#0b0e1f" fill-opacity=".85" stroke="#fff" stroke-opacity=".18"/>
  <circle cx="64" cy="68" r="5" fill="#ff5f57"/><circle cx="82" cy="68" r="5" fill="#febc2e"/><circle cx="100" cy="68" r="5" fill="#28c840"/>
  <rect x="124" y="58" width="250" height="20" rx="10" fill="#fff" fill-opacity=".07"/>
  <path d="M136 64v-2a4 4 0 0 1 8 0v2" stroke="#34d399" stroke-width="1.6" fill="none"/><rect x="134" y="64" width="12" height="9" rx="2" fill="#34d399"/>
  <text x="154" y="73" fill="#9aa3c7" font-size="11">Aakash T C S · Portfolio</text>
  <path d="M40 90H520" stroke="#fff" stroke-opacity=".12"/>

  <!-- Nav pill -->
  <rect x="64" y="104" width="432" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
  <rect x="72" y="110" width="16" height="16" rx="5" fill="url(#acc)"/>
  <g fill="#9aa3c7" fill-opacity=".6"><rect x="220" y="115" width="34" height="6" rx="3"/><rect x="264" y="115" width="44" height="6" rx="3"/><rect x="318" y="115" width="34" height="6" rx="3"/></g>
  <rect x="440" y="110" width="48" height="16" rx="8" fill="url(#acc)"/>

  <!-- Hero -->
  <text x="64" y="176" fill="#9aa3c7" font-size="13">Hi, I'm</text>
  <text x="64" y="212" fill="url(#acc)" font-size="34" font-weight="800">Aakash</text>
  <text x="196" y="212" fill="#e8eaf6" font-size="34" font-weight="800">T C S</text>
  <rect x="64" y="226" width="200" height="8" rx="4" fill="#9aa3c7" fill-opacity=".4"/>
  <rect x="64" y="242" width="160" height="8" rx="4" fill="#9aa3c7" fill-opacity=".3"/>
  <rect x="64" y="264" width="96" height="26" rx="13" fill="url(#acc)"/>
  <rect x="168" y="264" width="80" height="26" rx="13" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
  <circle cx="420" cy="220" r="62" fill="url(#acc)" fill-opacity=".35"/>
  <circle cx="420" cy="220" r="40" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/>
  <text x="420" y="229" fill="#e8eaf6" font-size="24" font-weight="800" text-anchor="middle">AT</text>

  <!-- Glass tiles -->
  <g fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14">
    <rect x="64" y="312" width="180" height="74" rx="12"/>
    <rect x="254" y="312" width="114" height="74" rx="12"/>
    <rect x="378" y="312" width="118" height="74" rx="12"/>
  </g>
  <rect x="78" y="326" width="22" height="22" rx="6" fill="url(#acc)"/>
  <rect x="268" y="326" width="22" height="22" rx="6" fill="url(#acc)"/>
  <rect x="392" y="326" width="22" height="22" rx="6" fill="url(#acc)"/>

  <!-- Security shield -->
  <path d="M640 64l92 34v76c0 64-40 112-92 132-52-20-92-68-92-132V98z" fill="url(#shield)" fill-opacity=".22" stroke="url(#shield)" stroke-width="3"/>
  <path d="M608 180l22 22 44-46" stroke="#e8eaf6" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="13" fill="#e8eaf6">
    <rect x="556" y="324" width="80" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="596" y="344" text-anchor="middle">CSP</text>
    <rect x="644" y="324" width="126" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="707" y="344" text-anchor="middle">Rate limiting</text>
    <rect x="556" y="362" width="128" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".6"/>
    <text x="620" y="382" text-anchor="middle">Input validation</text>
    <rect x="692" y="362" width="78" height="30" rx="15" fill="#fff" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".6"/>
    <text x="731" y="382" text-anchor="middle">Honeypot</text>
  </g>
